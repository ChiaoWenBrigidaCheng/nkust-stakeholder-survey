<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理階層重大永續議題調查</title>

  <style>
    :root {
      --page-bg: #f4faf4;
      --green-dark: #064a2a;
      --green-light: #167a45;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--page-bg);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        "Segoe UI",
        sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      text-align: center;
    }

    .banner-link {
      display: block;
      width: 100%;
      max-width: 1448px;
      margin: 0 auto;
      text-decoration: none;
    }

    .banner {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
    }

    .button-area {
      display: flex;
      justify-content: center;
      padding: 20px 16px 32px;
    }

    .start-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 360px;
      padding: 14px 38px;
      border-radius: 999px;
      background: linear-gradient(
        180deg,
        var(--green-light) 0%,
        var(--green-dark) 100%
      );
      color: #fff;
      text-decoration: none;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 0.08em;
      box-shadow: 0 8px 20px rgba(11, 77, 42, 0.25);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .start-button::after {
      content: "›";
      margin-left: 18px;
      font-size: 34px;
      line-height: 1;
    }

    .start-button:hover,
    .start-button:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 11px 24px rgba(11, 77, 42, 0.33);
    }

    @media (max-width: 600px) {
      .button-area {
        padding: 16px 14px 24px;
      }

      .start-button {
        width: min(100%, 360px);
        min-width: 0;
        padding: 13px 22px;
        font-size: 19px;
      }

      .start-button::after {
        margin-left: 14px;
        font-size: 30px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <a
      class="banner-link"
      href="management.html"
      aria-label="前往管理階層問卷"
    >
      <img
        class="banner"
        src="management-banner-management-final-v5.png"
        alt="115年國立高雄科技大學重大永續議題調查－管理階層問卷"
      >
    </a>

    <div class="button-area">
      <a class="start-button" href="management.html">開始填答</a>
    </div>
  </main>
</body>
</html>
