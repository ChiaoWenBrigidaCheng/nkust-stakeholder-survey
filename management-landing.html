<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理階層重大永續議題調查</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      background: #f4faf4;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC",
        "Microsoft JhengHei", "Segoe UI", sans-serif;
    }

    .page {
      width: 100%;
      text-align: center;
    }

    .banner {
      display: block;
      width: 100%;
      max-width: 1448px;
      height: auto;
      margin: 0 auto;
    }

    .button-area {
      padding: 18px 16px 30px;
    }

    .button-title {
      margin: 0 0 8px;
      color: #173f2c;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .start-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 360px;
      padding: 14px 36px;
      border-radius: 999px;
      background: linear-gradient(180deg, #167a45 0%, #064a2a 100%);
      color: #fff;
      text-decoration: none;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: .08em;
      box-shadow: 0 8px 20px rgba(11, 77, 42, .25);
    }

    .start-button::after {
      content: "›";
      margin-left: 18px;
      font-size: 34px;
      line-height: 1;
    }

    .start-button:hover,
    .start-button:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 11px 24px rgba(11, 77, 42, .33);
    }

    @media (max-width: 600px) {
      .button-title { font-size: 17px; }

      .start-button {
        width: min(100%, 360px);
        min-width: 0;
        padding: 13px 22px;
        font-size: 19px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <img
      class="banner"
      src="management-banner-management.png"
      alt="115年國立高雄科技大學重大永續議題調查－管理階層問卷"
    >

    <div class="button-area">
      <p class="button-title">管理階層問卷</p>
      <a class="start-button" href="management.html">開始填答</a>
    </div>
  </main>
</body>
</html>
