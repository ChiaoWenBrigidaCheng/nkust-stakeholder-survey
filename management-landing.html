<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理階層重大永續議題調查</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4faf4;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC",
        "Microsoft JhengHei", "Segoe UI", sans-serif;
    }
    main { width: 100%; text-align: center; }
    .banner {
      display: block;
      width: 100%;
      height: auto;
    }
    .button-wrap { padding: 20px 16px 28px; }
    .start-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 300px;
      padding: 14px 34px;
      border-radius: 999px;
      background: linear-gradient(180deg, #1f7a43 0%, #0b4d2a 100%);
      color: #fff;
      text-decoration: none;
      font-size: 21px;
      font-weight: 800;
      box-shadow: 0 7px 18px rgba(11, 77, 42, .25);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .start-button:hover,
    .start-button:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(11, 77, 42, .32);
    }
    @media (max-width: 768px) {
      .start-button {
        width: min(100%, 320px);
        min-width: 0;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <img
      src="management-banner-final.png"
      alt="115年國立高雄科技大學重大永續議題調查—管理階層問卷"
      class="banner"
    </div>
  </main>
</body>
</html>
