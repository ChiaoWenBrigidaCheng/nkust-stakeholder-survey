<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理階層重大永續議題調查</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --green-dark: #064a2a;
      --green: #0a6638;
      --green-light: #167a45;
      --page-bg: #f4faf4;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      color: #173126;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC",
        "Microsoft JhengHei", "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      text-align: center;
    }

    /*
      保留原始底圖，但將顯示範圍裁切到白色資訊卡底部，
      因此不再顯示底圖內建的「管理階層問卷／開始填答」圖像。
    */
    .poster-viewport {
      position: relative;
      width: 100%;
      max-width: 1448px;
      aspect-ratio: 1448 / 925;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
    }

    .poster-image {
      display: block;
      width: 100%;
      height: auto;
    }

    /*
      此區塊完整蓋住原底圖右側的舊 QR Code 卡片，
      再於相同位置建立新的 QR Code 卡片。
    */
    .qr-cover {
      position: absolute;
      left: 75.75%;
      top: 53.0%;
      width: 16.0%;
      height: 31.2%;
      padding: 0.85%;
      overflow: hidden;
      border: 1px solid #7f9f8b;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 4px 12px rgba(6, 43, 32, .10);
    }

    #qr-code {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
    }

    #qr-code canvas,
    #qr-code img {
      display: block;
      width: 100% !important;
      height: auto !important;
    }

    .qr-heading {
      margin: 5px -6% 0;
      padding: 5px 3px;
      background: var(--green-dark);
      color: #fff;
      font-size: clamp(9px, 1.22vw, 18px);
      font-weight: 900;
      line-height: 1.25;
    }

    .qr-label {
      margin: 5px 0 3px;
      color: #234936;
      font-size: clamp(8px, .95vw, 14px);
      font-weight: 800;
      line-height: 1.25;
    }

    .qr-file {
      display: block;
      margin: 0 auto;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--green-dark);
      color: #fff;
      font-size: clamp(7px, .72vw, 11px);
      font-weight: 700;
      line-height: 1.3;
    }

    .button-wrap {
      padding: 18px 16px 30px;
    }

    .button-label {
      margin: 0 0 7px;
      color: #173f2c;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .start-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 420px;
      padding: 14px 38px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--green-light) 0%, var(--green-dark) 100%);
      color: #fff;
      text-decoration: none;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: .08em;
      box-shadow: 0 8px 20px rgba(11, 77, 42, .25);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .start-button::after {
      content: "›";
      margin-left: 22px;
      font-size: 36px;
      font-weight: 400;
      line-height: .8;
    }

    .start-button:hover,
    .start-button:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 11px 24px rgba(11, 77, 42, .33);
    }

    .qr-fallback {
      padding: 8px;
      color: #365e49;
      font-size: 12px;
      line-height: 1.4;
    }

    @media (max-width: 768px) {
      .qr-cover {
        border-radius: 7px;
        border-width: .5px;
        box-shadow: none;
      }

      .qr-heading {
        margin-top: 2px;
        padding: 2px 1px;
        font-size: clamp(6px, 1.35vw, 10px);
      }

      .qr-label {
        margin: 2px 0 1px;
        font-size: clamp(5px, 1.1vw, 8px);
      }

      .qr-file {
        padding: 0 3px;
        font-size: clamp(4px, .9vw, 7px);
      }

      .button-label {
        font-size: 17px;
      }

      .start-button {
        width: min(100%, 390px);
        min-width: 0;
        padding: 13px 22px;
        font-size: 19px;
      }

      .start-button::after {
        margin-left: 15px;
        font-size: 30px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="poster-viewport">
      <img
        src="management-banner-final.png"
        alt="115年國立高雄科技大學重大永續議題調查—管理階層問卷"
        class="poster-image"
      >

      <div class="qr-cover" aria-label="管理階層問卷 QR Code">
        <div id="qr-code"></div>
        <div class="qr-heading">掃描 QR Code<br>填寫問卷</div>
        <div class="qr-label">管理階層問卷</div>
        <span class="qr-file">management.html</span>
      </div>
    </div>

    <div class="button-wrap">
      <p class="button-label">管理階層問卷</p>
      <a class="start-button" href="management.html">開始填答</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    (function () {
      const holder = document.getElementById("qr-code");
      const targetUrl = new URL("management.html", window.location.href).href;

      if (typeof QRCode === "undefined") {
        holder.innerHTML =
          '<div class="qr-fallback">QR Code 載入失敗，請使用下方按鈕填答。</div>';
        return;
      }

      new QRCode(holder, {
        text: targetUrl,
        width: 300,
        height: 300,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    })();
  </script>
</body>
</html>
