<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理階層重大永續議題調查</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --green-dark: #064a2a;
      --green-light: #167a45;
      --page-bg: #f4faf4;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      color: #173126;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC",
        "Microsoft JhengHei", "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      text-align: center;
    }

    /*
      直接使用原始 PNG。
      不再另外疊加 HTML QR Code，避免與圖片中的 QR Code 重疊。
      顯示範圍裁切至白色資訊卡底部，隱藏圖片內建的下方開始填答圖像。
    */
    .poster-viewport {
      width: 100%;
      max-width: 1448px;
      aspect-ratio: 1448 / 925;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
    }

    .poster-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .button-wrap {
      padding: 18px 16px 30px;
    }

    .button-label {
      margin: 0 0 7px;
      color: #173f2c;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .start-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 420px;
      padding: 14px 38px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--green-light) 0%, var(--green-dark) 100%);
      color: #fff;
      text-decoration: none;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: .08em;
      box-shadow: 0 8px 20px rgba(11, 77, 42, .25);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .start-button::after {
      content: "›";
      margin-left: 22px;
      font-size: 36px;
      font-weight: 400;
      line-height: .8;
    }

    .start-button:hover,
    .start-button:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 11px 24px rgba(11, 77, 42, .33);
    }

    @media (max-width: 768px) {
      .button-label {
        font-size: 17px;
      }

      .start-button {
        width: min(100%, 390px);
        min-width: 0;
        padding: 13px 22px;
        font-size: 19px;
      }

      .start-button::after {
        margin-left: 15px;
        font-size: 30px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="poster-viewport">
      <img
        src="management-banner-final.png"
        alt="115年國立高雄科技大學重大永續議題調查—管理階層問卷"
        class="poster-image"
      >
    </div>

    <div class="button-wrap">
      <p class="button-label">管理階層問卷</p>
      <a class="start-button" href="management.html">開始填答</a>
    </div>
  </main>
</body>
</html>
